<!DOCTYPE html>
<html>
<head>
    <title>Magic Mirror Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f0f0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn { background: #6d28d9; color: white; padding: 15px 30px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .hidden { display: none; }
        img { width: 100%; border-radius: 10px; margin-top: 10px; }
        #loading { color: #6d28d9; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Lumière Atelier</h1>
        <p>Emerald Silk Dress - $189</p>
        
        <img src="https://images.unsplash.com/photo-1539109136881-3be0610917c1?w=400" alt="Dress">

        <button id="tryBtn" class="btn" onclick="startDemo()">✨ Try it on You</button>

        <div id="loading" class="hidden">
            <p id="statusText">Analyzing silhouette...</p>
        </div>

        <div id="result" class="hidden">
            <h3>Your AI Fitting:</h3>
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400" alt="Result">
            <button class="btn" style="background: #10b981;">Looks Great! Add to Cart</button>
        </div>
    </div>

    <script>
        function startDemo() {
            // Hide button, show loading
            document.getElementById('tryBtn').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const steps = ["Analyzing silhouette...", "Draping fabric...", "Finalizing look..."];
            let currentStep = 0;

            const timer = setInterval(() => {
                currentStep++;
                if (currentStep < steps.length) {
                    document.getElementById('statusText').innerText = steps[currentStep];
                } else {
                    clearInterval(timer);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                }
            }, 1500);
        }
    </script>

</body>
</html>
